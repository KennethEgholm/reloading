<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Page / paper -->
  <rect 
    x="10" y="8" 
    width="44" height="48" 
    rx="3" 
    fill="#F5F0E4"
  />
  <!-- Subtle right edge shadow for depth -->
  <rect 
    x="10" y="8" 
    width="44" height="48" 
    rx="3" 
    fill="none" 
    stroke="#D8D0C0" 
    stroke-width="2"
  />

  <!-- Left binding / spine -->
  <rect 
    x="10" y="8" 
    width="7" height="48" 
    rx="2" 
    fill="#C5B8A0"
  />

  <!-- Horizontal log lines -->
  <rect x="22" y="18" width="26" height="2" rx="1" fill="#666"/>
  <rect x="22" y="26" width="26" height="2" rx="1" fill="#666"/>
  <rect x="22" y="34" width="26" height="2" rx="1" fill="#666"/>
  <rect x="22" y="42" width="26" height="2" rx="1" fill="#666"/>
  <rect x="22" y="50" width="26" height="2" rx="1" fill="#666"/>
</svg>
