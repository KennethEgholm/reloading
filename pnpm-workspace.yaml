# Approve postinstall/build scripts for these dependencies. This pnpm build
# blocks all build scripts by default and fails `--frozen-lockfile` installs
# with ERR_PNPM_IGNORED_BUILDS otherwise. Required for Next.js tooling + Prisma.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  prisma: true
  sharp: true
  unrs-resolver: true
