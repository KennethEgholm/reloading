# Allow specific packages to run postinstall/build scripts.
# Required for Next.js tooling and Prisma.
allowBuildScripts:
  - sharp
  - unrs-resolver
  - prisma
  - '@prisma/engines'
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': set this to true or false
  '@swc/core': true
  prisma: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
