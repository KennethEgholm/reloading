name: reloading-prod

services:
  db:
    image: postgres:16-alpine
    container_name: reloading-postgres
    environment:
      POSTGRES_USER: reloading
      POSTGRES_PASSWORD: reloading
      POSTGRES_DB: reloading
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reloading"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: reloading-app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      TZ: Europe/Copenhagen
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: reloading-cloudflared
    command: tunnel run --token ${TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped

  github-runner:
    build: ./github-runner
    container_name: reloading-github-runner
    environment:
      - ACTIONS_RUNNER_REPO_URL=${ACTIONS_RUNNER_REPO_URL}
      - ACTIONS_RUNNER_TOKEN=${ACTIONS_RUNNER_TOKEN}
      - RUNNER_NAME=${RUNNER_NAME:-reloading-runner}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
